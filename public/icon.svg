<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#1a1815" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#DFC18D" />
      <stop offset="100%" stop-color="#B38B46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="492" height="492" x="10" y="10" rx="100" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Chandelier Icon Symbol -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Top Chain / Hook -->
    <path d="M256 70 L256 120" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
    <circle cx="256" cy="65" r="12" fill="none" stroke="url(#gold)" stroke-width="8" />

    <!-- Top Crown -->
    <path d="M220 120 C240 110, 272 110, 292 120 L280 140 L232 140 Z" fill="url(#gold)" />

    <!-- Center Column -->
    <path d="M256 140 L256 310" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
    <circle cx="256" cy="200" r="18" fill="url(#gold)" />
    <circle cx="256" cy="260" r="24" fill="url(#gold)" />

    <!-- Main Chandelier Arms -->
    <path d="M256 280 C180 280, 130 220, 110 180" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
    <path d="M256 280 C332 280, 382 220, 402 180" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" />
    
    <path d="M256 295 C200 295, 160 250, 140 210" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />
    <path d="M256 295 C312 295, 352 250, 372 210" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" />

    <!-- Candle Cups & Flames -->
    <!-- Left 1 -->
    <path d="M96 180 L124 180 L118 195 L102 195 Z" fill="url(#gold)" />
    <ellipse cx="110" cy="165" rx="6" ry="12" fill="#FFF5D1" />
    <!-- Left 2 -->
    <path d="M126 210 L154 210 L148 225 L132 225 Z" fill="url(#gold)" />
    <ellipse cx="140" cy="195" rx="5" ry="10" fill="#FFF5D1" />

    <!-- Right 1 -->
    <path d="M388 180 L416 180 L410 195 L394 195 Z" fill="url(#gold)" />
    <ellipse cx="402" cy="165" rx="6" ry="12" fill="#FFF5D1" />
    <!-- Right 2 -->
    <path d="M358 210 L386 210 L380 225 L364 225 Z" fill="url(#gold)" />
    <ellipse cx="372" cy="195" rx="5" ry="10" fill="#FFF5D1" />

    <!-- Hanging Crystals Drop -->
    <path d="M256 310 L256 350" stroke="url(#gold)" stroke-width="4" stroke-dasharray="4 4" />
    <polygon points="256,350 266,370 256,390 246,370" fill="url(#gold)" />

    <polygon points="110,200 116,215 110,230 104,215" fill="url(#gold)" opacity="0.8" />
    <polygon points="402,200 408,215 402,230 396,215" fill="url(#gold)" opacity="0.8" />
  </g>

  <!-- Title Text -->
  <text x="256" y="440" text-anchor="middle" fill="url(#gold)" font-family="sans-serif" font-weight="bold" font-size="28" letter-spacing="2">
    لوستر اکبر صالحی
  </text>
</svg>
